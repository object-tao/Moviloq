name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://moviloq.com
    env:
      CLOUDFLARE_ENV: production
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Verify administrator Access policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOVILOQ_ADMIN_OWNER_SHA256: ${{ secrets.MOVILOQ_ADMIN_OWNER_SHA256 }}
        run: node scripts/verify-admin-access.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply DB --remote --config wrangler.jsonc --env production
            deploy
            deploy --config wrangler.admin.jsonc --env production

      - name: Verify public website and API
        run: |
          node scripts/smoke.mjs https://moviloq.com production
          node scripts/smoke.mjs https://www.moviloq.com production
          node scripts/admin-smoke.mjs https://admin.moviloq.com

      - name: Verify administrator origin stays isolated
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOVILOQ_ADMIN_OWNER_SHA256: ${{ secrets.MOVILOQ_ADMIN_OWNER_SHA256 }}
        run: node scripts/verify-admin-access.mjs
